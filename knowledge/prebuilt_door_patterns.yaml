schema_version: 1
last_updated: "2026-07-30"

system: "Fixed physical door compatibility for handcrafted prebuilt rooms"
status: "pattern_door_resolver_implemented_and_tested"

enums:
  door_pattern:
    name: "E_PreBuiltDoorPattern"
    status: "confirmed_created_in_unreal"
    entries:
      - "DeadEnd"
      - "Straight"
      - "Corner"
      - "TShape"
      - "Cross"
  door_rotation:
    name: "E_PreBuiltDoorRotation"
    status: "confirmed_created_in_unreal"
    entries:
      - "Rot0"
      - "Rot90"
      - "Rot180"
      - "Rot270"

BP_Room_PreBuilt_Base:
  variables:
    bUseFixedDoorPattern:
      type: "Boolean"
      category: "PreBuilt Doors"
      default: false
      status: "confirmed_created"
      purpose: "False preserves the flexible WallFill system; true marks a handcrafted room with fixed physical doors."
    DoorPattern:
      type: "E_PreBuiltDoorPattern"
      category: "PreBuilt Doors"
      default: "DeadEnd"
      status: "confirmed_created"
      purpose: "Declares the physical door shape of a fixed handcrafted room."
    DoorPatternBaseRotation:
      type: "E_PreBuiltDoorRotation"
      category: "PreBuilt Doors"
      default: "Rot0"
      status: "confirmed_created"
      purpose: "Declares the local orientation in which the handcrafted physical openings were built."

corner_test_asset:
  name: "BP_Room_PreBuilt_Test_Corner"
  parent: "BP_Room_PreBuilt_Base"
  status: "confirmed_created_and_saved"
  bUseFixedDoorPattern: true
  DoorPattern: "Corner"
  DoorPatternBaseRotation: "Rot180"
  physical_openings_local: ["South", "West"]
  integration_status: "isolated_not_used_by_generator"

canonical_local_patterns:
  DeadEnd: ["North"]
  Straight: ["North", "South"]
  Corner: ["North", "East"]
  TShape: ["North", "East", "West"]
  Cross: ["North", "East", "South", "West"]

rotation_mapping:
  allowed_degrees: [0, 90, 180, 270]
  DeadEnd:
    Rot0: ["North"]
    Rot90: ["East"]
    Rot180: ["South"]
    Rot270: ["West"]
  Straight:
    Rot0: ["North", "South"]
    Rot90: ["East", "West"]
    Rot180: ["North", "South"]
    Rot270: ["East", "West"]
  Corner:
    Rot0: ["North", "East"]
    Rot90: ["East", "South"]
    Rot180: ["South", "West"]
    Rot270: ["West", "North"]
  TShape:
    Rot0: ["North", "East", "West"]
    Rot90: ["North", "East", "South"]
    Rot180: ["East", "South", "West"]
    Rot270: ["North", "South", "West"]
  Cross:
    Rot0: ["North", "East", "South", "West"]
    Rot90: ["North", "East", "South", "West"]
    Rot180: ["North", "East", "South", "West"]
    Rot270: ["North", "East", "South", "West"]
  status: "implemented_in_GetPreBuiltPatternDoors"

GetPreBuiltPatternDoors:
  owner: "BP_DungeonGenerator_V2"
  status: "compiled_and_runtime_tested"
  inputs:
    Door_Pattern: "E_PreBuiltDoorPattern"
    Base_Rotation: "E_PreBuiltDoorRotation"
  outputs:
    North: "Boolean"
    East: "Boolean"
    South: "Boolean"
    West: "Boolean"
  implementation: "Switch on E_PreBuiltDoorPattern followed by Switch on E_PreBuiltDoorRotation and explicit Return Nodes."
  isolated_test:
    input:
      Door_Pattern: "Corner"
      Base_Rotation: "Rot180"
    output:
      North: false
      East: false
      South: true
      West: true
    result: "confirmed"

compatibility_rule: "A fixed prebuilt room is valid only when its physical North/East/South/West doors exactly match the connections required by ST_DungeonCell."

protected_current_behavior:
  - "bUseFixedDoorPattern remains false by default"
  - "Current Start/Key/Boss prototypes remain flexible"
  - "BP_RoomMaster_Dungeon remains procedural"
  - "Init Room from Cell has not been modified"
  - "PlaceChildRoomFromParent has not been modified"

next_step: "Create an isolated helper that compares GetPreBuiltPatternDoors outputs against ST_DungeonCell North/East/South/West and returns one exact-match Boolean. First MVP integration may accept only the authored local orientation before adding actor placement rotation."