schema_version: 1
last_updated: "2026-07-26"

system: "Fixed physical door compatibility for handcrafted prebuilt rooms"
status: "enum_and_base_metadata_created"

enum:
  name: "E_PreBuiltDoorPattern"
  status: "confirmed_created_in_unreal"
  entries:
    - "DeadEnd"
    - "Straight"
    - "Corner"
    - "TShape"
    - "Cross"

BP_Room_PreBuilt_Base:
  variables:
    bUseFixedDoorPattern:
      type: "Boolean"
      category: "PreBuilt Doors"
      default: false
      status: "confirmed_created"
      purpose: "False preserves the flexible WallFill system; true marks a handcrafted room with fixed physical doors."
    DoorPattern:
      type: "E_PreBuiltDoorPattern"
      category: "PreBuilt Doors"
      default: "DeadEnd"
      status: "confirmed_created"
      purpose: "Declares the physical door shape of a fixed handcrafted room."

canonical_local_patterns:
  DeadEnd: ["North"]
  Straight: ["North", "South"]
  Corner: ["North", "East"]
  TShape: ["North", "East", "West"]
  Cross: ["North", "East", "South", "West"]

rotation_plan:
  allowed_degrees: [0, 90, 180, 270]
  status: "conceptual_not_implemented"
  example_corner:
    0: ["North", "East"]
    90: ["East", "South"]
    180: ["South", "West"]
    270: ["West", "North"]

compatibility_rule: "A fixed prebuilt room is valid only when its rotated physical doors exactly match the North/East/South/West connections required by ST_DungeonCell."

protected_current_behavior:
  - "bUseFixedDoorPattern remains false by default"
  - "Current Start/Key/Boss prototypes remain flexible"
  - "BP_RoomMaster_Dungeon remains procedural"
  - "Init Room from Cell has not been modified"
  - "PlaceChildRoomFromParent has not been modified"

next_step: "Create an isolated Corner test child from BP_Room_PreBuilt_Base and mark it as fixed-pattern metadata only."
