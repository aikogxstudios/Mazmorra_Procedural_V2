schema_version: 1
last_updated: "2026-08-02"

system: "Fixed physical door compatibility for handcrafted prebuilt rooms"
status: "paused_after_partial_corner_integration"

pause_decision:
  active: true
  reason:
    - "The base 13-room dungeon is stable again."
    - "Corner selection and spawning work partially, but final visual orientation is not yet proven."
    - "Adding more conversion functions now increases complexity and regression risk."
  rule: "Do not add another rotation or local-door helper until the approach is reviewed and simplified."
  handoff: "sessions/2026-08-02_CORNER_ROTATION_INTEGRATION_PAUSED.md"

enums:
  door_pattern:
    name: "E_PreBuiltDoorPattern"
    status: "confirmed_created_in_unreal"
    entries: ["DeadEnd", "Straight", "Corner", "TShape", "Cross"]
  door_rotation:
    name: "E_PreBuiltDoorRotation"
    status: "confirmed_created_in_unreal"
    entries: ["Rot0", "Rot90", "Rot180", "Rot270"]

BP_Room_PreBuilt_Base:
  variables:
    bUseFixedDoorPattern:
      type: "Boolean"
      category: "PreBuilt Doors"
      default: false
      status: "confirmed_created"
    DoorPattern:
      type: "E_PreBuiltDoorPattern"
      category: "PreBuilt Doors"
      default: "DeadEnd"
      status: "confirmed_created"
    DoorPatternBaseRotation:
      type: "E_PreBuiltDoorRotation"
      category: "PreBuilt Doors"
      default: "Rot0"
      status: "confirmed_created"
  inherited_functions:
    - "Get Room Bounds Data"
    - "Get Door World Location"
    - "Init Room from Cell"
  child_override_rule: "Do not create empty overrides in children. Empty overrides replace inherited logic and return default zero outputs."

corner_test_asset:
  name: "BP_Room_PreBuilt_Test_Corner"
  parent: "BP_Room_PreBuilt_Base"
  status: "integrated_experimentally_but_orientation_unresolved"
  bUseFixedDoorPattern: true
  DoorPattern: "Corner"
  DoorPatternBaseRotation: "Rot180"
  physical_openings_local: ["South", "West"]
  bounds_override_bug_fixed: true
  can_spawn: true
  can_return_valid_bounds: true
  final_visual_orientation_validated: false

canonical_local_patterns:
  DeadEnd: ["North"]
  Straight: ["North", "South"]
  Corner: ["North", "East"]
  TShape: ["North", "East", "West"]
  Cross: ["North", "East", "South", "West"]

rotation_mapping:
  allowed_degrees: [0, 90, 180, 270]
  DeadEnd:
    Rot0: ["North"]
    Rot90: ["East"]
    Rot180: ["South"]
    Rot270: ["West"]
  Straight:
    Rot0: ["North", "South"]
    Rot90: ["East", "West"]
    Rot180: ["North", "South"]
    Rot270: ["East", "West"]
  Corner:
    Rot0: ["North", "East"]
    Rot90: ["East", "South"]
    Rot180: ["South", "West"]
    Rot270: ["West", "North"]
  TShape:
    Rot0: ["North", "East", "West"]
    Rot90: ["North", "East", "South"]
    Rot180: ["East", "South", "West"]
    Rot270: ["North", "South", "West"]
  Cross:
    Rot0: ["North", "East", "South", "West"]
    Rot90: ["North", "East", "South", "West"]
    Rot180: ["North", "East", "South", "West"]
    Rot270: ["North", "East", "South", "West"]
  status: "implemented_in_GetPreBuiltPatternDoors"

functions:
  GetPreBuiltPatternDoors:
    owner: "BP_DungeonGenerator_V2"
    status: "compiled_and_runtime_tested"
    isolated_test:
      input: "Corner + Rot180"
      output:
        North: false
        East: false
        South: true
        West: true
      result: "confirmed"

  DoesPreBuiltPatternMatchCell:
    owner: "BP_DungeonGenerator_V2"
    status: "compiled_and_isolated_tested"
    isolated_tests:
      - "Corner Rot180 vs South+West -> true"
      - "Corner Rot180 vs South only -> false"

  FindMatchingPreBuiltDoorRotation:
    owner: "BP_DungeonGenerator_V2"
    status: "created_compiled_partial_integration"
    result: "Can select a compatible Corner candidate, but final actor orientation is not fully validated."

  WorldDirectionToLocalDoorDirection:
    owner: "BP_Room_PreBuilt_Base"
    status: "created_and_connected_not_fully_validated"
    direction_indexes:
      North: 0
      East: 1
      South: 2
      West: 3
    warning: "Do not treat this mapping as final until every Corner orientation passes a focused visual/door alignment test."

  GetLocalDoorFlagsFromCell:
    status: "not_implemented"

stable_current_generation:
  MaxRooms: 10
  total_physical_rooms: 13
  composition:
    Start: 1
    Normal: 10
    Key: 1
    Boss: 1
  seed_12345_tested: true
  selected_room_yaw_table:
    Rot0: 180.0
    Rot90: 270.0
    Rot180: 0.0
    Rot270: 90.0
  rule: "Freeze this table while the integration is paused."

rejected_yaw_table_for_current_implementation:
  Rot0: 180.0
  Rot90: 90.0
  Rot180: 0.0
  Rot270: 270.0
  result: "Corner PLACE FAIL after overlap retries."

confirmed_bug_fix:
  bug: "Empty child override of Get Room Bounds Data returned zero bounds."
  affected_assets:
    - "BP_Room_PreBuilt_Base_Child_Key"
    - "BP_Room_PreBuilt_Test_Corner"
  symptoms:
    - "Bounds Center = 0,0,0"
    - "Bounds Extent = 0,0,0"
    - "Permanent overlap during all retries"
    - "Physical generation stopped before 13 rooms"
  fix: "Remove/recreate broken child override and inherit the parent implementation."
  validation: "13 physical rooms restored."

debug_status:
  keep_temporarily:
    - "BOUNDS TEST"
    - "MOVE TEST"
    - "PLACE FAIL | Index / Type / Class"
    - "MVP: PREBUILT CORNER SELECTED"
    - "Global Overlap"
  separate_error_messages:
    spawn: "DUNGEON ERROR SPAWN — SpawnActor returned invalid"
    placement: "DUNGEON ERROR PLACE — No free position after retries"

compatibility_rule: "A fixed prebuilt room is valid only when its physical doors, after final actor placement, exactly match the ST_DungeonCell connections."

next_decision_options:
  A: "Keep the grid-first generator and retry Corner integration later with a small isolated placement test."
  B: "Remove fixed Corner from the beta path and continue toward corridors and playable 0.0.5.9."
  C: "Redesign future layout growth around available/open doors after the first playable beta."

recommended_immediate_priority: "Protect the stable 13-room generator and decide whether Corner is required for the first private beta."
