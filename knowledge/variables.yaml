schema_version: 1
last_updated: "2026-07-25"

BP_DungeonGenerator_V2:
  member_variables:
    CorridorDebugClass: {type: "Actor Class Reference", category: "Pasillos", status: "confirmed"}
    SpawnedCorridors: {type: "Array Actor Reference", category: "Pasillos", status: "confirmed"}
    CellSize: {type: "Float", category: "Habitaciones", status: "confirmed"}
    DungeonSeed: {type: "Integer", category: "Habitaciones", status: "confirmed"}
    MaxGenerationAttempts: {type: "Integer", category: "Habitaciones", status: "confirmed"}
    StartDebugRoomClass:
      type: "Actor Class Reference"
      category: "Habitaciones"
      status: "confirmed_historical_name"
    SpawnedRooms: {type: "Array Actor Reference", category: "Habitaciones", status: "confirmed"}
    DungeonCells: {type: "Array ST_DungeonCell", category: "Habitaciones", status: "confirmed"}
    DungeonCellLinks: {type: "Array ST_DungeonCellLink", category: "Habitaciones", status: "confirmed"}
    RandomStream: {type: "Random Stream", category: "Habitaciones", status: "confirmed"}
    MaxRooms:
      type: "Integer"
      category: "Habitaciones"
      status: "confirmed_semantics_changed"
      note: "Counts only Normal rooms. BuildDungeonLayout targets MaxRooms + 1 for Start."
    bUseRandomSeed: {type: "Boolean", category: "Habitaciones", status: "confirmed"}
    SelectedRoomClass: {type: "Actor Class Reference", category: "Habitaciones", status: "confirmed"}
    DebugRoomClass: {type: "Actor Class Reference", category: "Debug", status: "confirmed"}
    bGenerateonBeginPlay: {type: "Boolean", category: "Debug", status: "confirmed"}
    bDebugDungeon: {type: "Boolean", category: "Debug", status: "confirmed"}
    BossCellIndex:
      type: "Integer"
      category: "Boss Room"
      status: "confirmed_semantics_changed"
      note: "Normal parent selected for additive Boss room; no longer the cell converted to Boss."
    BossGridX: {type: "Integer", category: "Boss Room", status: "confirmed"}
    BossGridY: {type: "Integer", category: "Boss Room", status: "confirmed"}
    BossDebugRoomClass:
      type: "Actor Class Reference"
      category: "Boss Room"
      status: "confirmed"
      current_class: "BP_Room_PreBuilt_Base_Child_Boss"
    BestBossDistance: {type: "Integer", category: "Boss Room", status: "documented"}
    KeyCellIndex:
      type: "Integer"
      category: "Key Room"
      status: "confirmed_semantics_changed"
      note: "Normal parent selected for additive Key room; no longer the cell converted to Key."
    KeyGridX: {type: "Integer", category: "Key Room", status: "confirmed"}
    KeyGridY: {type: "Integer", category: "Key Room", status: "confirmed"}
    KeyDebugRoomClass:
      type: "Actor Class Reference"
      category: "Key Room"
      status: "confirmed"
      current_class: "BP_Room_PreBuilt_Base_Child_Key"
    BestKeyDistance:
      type: "Integer"
      category: "Key Room"
      status: "documented"
      note: "Stores KeyScore, not a simple distance."
    BossDoorClass: {type: "Actor Class Reference", category: "Puertas", status: "confirmed"}
    SpawnedDungeonDoors: {type: "Array Actor Reference", category: "Puertas", status: "confirmed"}

  PlaceChildRoomFromParent_inputs:
    Child_Index: {type: "Integer", status: "confirmed"}

  PlaceChildRoomFromParent_outputs:
    Room_Placed: {type: "Boolean", status: "confirmed"}

  PlaceChildRoomFromParent_local_variables:
    Parent_Room_Actor:
      type: "Actor Object Reference"
      status: "confirmed"
      source: "SpawnedRooms[Parent Cell Index]"
    Child_Room_Actor:
      type: "Actor Object Reference"
      status: "confirmed"
      note: "Spawned once and moved through retries."
    Child_Entry_Direction:
      type: "E_DungeonDirection"
      status: "confirmed"
      source: "GetOppositeDirection(Parent Direction)"
    Parent_Direction:
      type: "E_DungeonDirection"
      status: "confirmed"
      source: "DungeonCellLinks[Child Index].DirectionFromParent"
    Parent_Door_Location: {type: "Vector", status: "confirmed"}
    Child_Door_Location:
      type: "Vector"
      status: "confirmed"
      note: "Requeried every attempt after movement."
    Corridor_Length:
      type: "Float"
      status: "confirmed"
      test_default: 1000.0
    Placement_Attempt:
      type: "Integer"
      status: "confirmed"
      source: "Placement For Loop Index"
    Placement_Retry_Step:
      type: "Float"
      status: "confirmed"
      test_default: 500.0
    Max_Placement_Attempts:
      type: "Integer"
      status: "confirmed"
      test_default: 10
    bPlacement_Succeeded:
      type: "Boolean"
      status: "confirmed"
      initial_value: false
    Bounds_Overlap:
      type: "Boolean"
      status: "confirmed"
      source: "DoesRoomOverlapPlacedRooms output"

  DoesRoomOverlapPlacedRooms_inputs:
    Candidate_Room_Actor: {type: "Actor Object Reference", status: "confirmed"}

  DoesRoomOverlapPlacedRooms_outputs:
    Overlaps_Placed_Rooms: {type: "Boolean", status: "confirmed"}

  DoesRoomOverlapPlacedRooms_local_variables:
    Candidate_Bounds_Center: {type: "Vector", status: "confirmed"}
    Candidate_Bounds_Extent: {type: "Vector", status: "confirmed"}
    Placed_Room_Actor: {type: "Actor Object Reference", status: "confirmed"}
    Placed_Bounds_Center: {type: "Vector", status: "confirmed"}
    Placed_Bounds_Extent: {type: "Vector", status: "confirmed"}
    Found_Overlap:
      type: "Boolean"
      status: "confirmed"
      initial_value: false

  TryAddSpecialCellFromParent_inputs:
    Parent_Cell_Index: {type: "Integer", status: "confirmed"}
    Special_Room_Type: {type: "E_DungeonRoomType", status: "confirmed"}

  TryAddSpecialCellFromParent_outputs:
    bAdded: {type: "Boolean", status: "confirmed"}
    New_Cell_Index:
      type: "Integer"
      status: "confirmed"
      failure_value: -1
      success_source: "Return Value of DungeonCells Add"

  TryAddSpecialCellFromParent_local_variables:
    Direction_Start_Index:
      type: "Integer"
      status: "confirmed"
      source: "Random Integer in Range from Stream 0..3"
    Random_Direction_Index:
      type: "Integer"
      status: "confirmed_inherited_name"
      formula: "(Direction Start Index + For Loop Index) % 4"
    Random_Cell_Index:
      type: "Integer"
      status: "confirmed_inherited_name"
      source: "Parent Cell Index"
    Selected_Cell: {type: "ST_DungeonCell", status: "confirmed"}
    Selected_Direction: {type: "E_DungeonDirection", status: "confirmed"}
    Neighbor_X: {type: "Integer", status: "confirmed"}
    Neighbor_Y: {type: "Integer", status: "confirmed"}
    New_Room_Seed: {type: "Integer", status: "confirmed"}
    Updated_Selected_Cell: {type: "ST_DungeonCell", status: "confirmed"}
    New_Base_Cell: {type: "ST_DungeonCell", status: "confirmed"}
    Opposite_Direction: {type: "E_DungeonDirection", status: "confirmed"}
    New_Connected_Cell: {type: "ST_DungeonCell", status: "confirmed"}

  SpawnFirstChildRoom_local_variables:
    status: "historical_prototype_pending_cleanup"
    note: "Many variables were generalized into PlaceChildRoomFromParent. Keep until Find References cleanup."

BP_RoomMaster_Dungeon:
  variables:
    RoomWidth: {type: "Integer", category: "Room", status: "confirmed"}
    RoomDepth: {type: "Integer", category: "Room", status: "confirmed"}
    WallHeightTiles: {type: "Integer", category: "Room", status: "confirmed"}
    TileSize: {type: "Float", category: "Room", status: "confirmed"}
    EffectiveTileSize: {type: "Float", category: "Room", status: "confirmed"}
    WallTileHeight: {type: "Float", category: "Room", status: "confirmed"}
    bGenerateCeiling: {type: "Boolean", category: "Room", status: "confirmed"}
    bRandomizeRoomSize: {type: "Boolean", category: "Room", status: "confirmed"}
    MinRoomWidth: {type: "Integer", category: "Room", status: "confirmed"}
    MaxRoomWidth: {type: "Integer", category: "Room", status: "confirmed"}
    MinRoomDepth: {type: "Integer", category: "Room", status: "confirmed"}
    MaxRoomDepth: {type: "Integer", category: "Room", status: "confirmed"}
    OpeningWidthTiles: {type: "Integer", category: "Opening", status: "confirmed"}
    OpeningHeightTiles: {type: "Integer", category: "Opening", status: "documented"}
    bNorthOpening: {type: "Boolean", category: "Opening", status: "documented"}
    bEastOpening: {type: "Boolean", category: "Opening", status: "documented"}
    bWestOpening: {type: "Boolean", category: "Opening", status: "documented"}
    bSouthOpening: {type: "Boolean", category: "Dungeon", status: "confirmed"}
    bRandomizeExits: {type: "Boolean", category: "Opening", status: "documented"}
    bUseDungeonConnections: {type: "Boolean", category: "Dungeon", status: "confirmed"}
    CurrentCellData: {type: "ST_DungeonCell", category: "Dungeon", status: "confirmed"}
    BoundsPadding: {type: "Float", category: "Bounds", status: "confirmed", reference_value: 5}
    BoundsPaddingZ: {type: "Float", category: "Bounds", status: "confirmed", reference_value: 20}

BP_Room_PreBuilt_Base:
  components_and_properties:
    RoomBounds:
      type: "Box Collision Component"
      status: "confirmed"
      test_box_extent: [980, 980, 400]
      final_relative_location_visual_check: "pending"
    DoorPoint_North: {type: "Scene/Arrow Component", status: "confirmed_visible"}
    DoorPoint_East: {type: "Scene/Arrow Component", status: "confirmed_visible"}
    DoorPoint_South: {type: "Scene/Arrow Component", status: "confirmed_visible"}
    DoorPoint_West: {type: "Scene/Arrow Component", status: "confirmed_visible"}
  children_confirmed:
    BP_Room_PreBuilt_Base_Child_Key: {status: "confirmed", bounds_valid: true}
    BP_Room_PreBuilt_Base_Child_Boss: {status: "confirmed", bounds_valid: true}
  inherited_debug_components_present: true

future_prebuilt_door_pattern_data:
  status: "pending_design"
  possible_fields:
    - "Available Door Directions or compact bitmask"
    - "Allowed Rotations"
    - "Room Shape/Pattern enum"
  patterns:
    Dead_End: 1
    Straight: 2
    Corner_L: 2
    T: 3
    Cross: 4
