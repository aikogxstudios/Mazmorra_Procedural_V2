schema_version: 1
last_updated: "2026-07-25"
blueprint: "BP_DungeonGenerator_V2"
type: "Blueprint Actor"

components:
  - name: "Scene"
    type: "Scene Component"
    certainty: "confirmed"

critical_invariant: "DungeonCells[Index] = DungeonCellLinks[Index] = SpawnedRooms[Index]"

functions:
  - name: "GenerateDungeon"
    status: "confirmed_current_flow"
    current_flow:
      - "Switch Has Authority"
      - "ResetDungeon"
      - "InitRandomStream"
      - "CreateStartCell"
      - "BuildDungeonLayout"
      - "ChooseKeyAndBossCells"
      - "SpawnStartRoom"
      - "For Loop with Break: 1 to DungeonCells.Length - 1"
      - "PlaceChildRoomFromParent(Index)"
      - "Room Placed false -> Break"
    disconnected_legacy_tail:
      - "SpawnRoomsFromCells"
      - "SpawnCorridorsFromConnections"
      - "SpawnBossRoomDoors"
      - "DebugDrawDoorPoints"
      - "DebugDrawDoorToDoorConnections"

  - name: "ResetDungeon"
    status: "protected"
    responsibility: "Destroy generated actors, clear arrays and reset special indices."

  - name: "CreateStartCell"
    status: "confirmed"
    produces:
      cell:
        GridX: 0
        GridY: 0
        RoomType: "Start"
        RoomID: 0
      link:
        ParentCellIndex: -1
        DirectionFromParent: "North"
        bHasParent: false

  - name: "BuildDungeonLayout"
    status: "confirmed_modified"
    MaxRooms_semantics: "Normal rooms only"
    target_condition: "DungeonCells.Length >= MaxRooms + 1"
    plus_one_reason: "Start"

  - name: "TryAddRandomCell"
    status: "confirmed_normal_room_generation"
    room_type: "Normal"
    child_link:
      ParentCellIndex: "Random Cell Index"
      DirectionFromParent: "Selected Direction"
      bHasParent: true
    start_guard: "Start may receive only one logical connection"

  - name: "TryAddSpecialCellFromParent"
    status: "confirmed"
    inputs:
      Parent_Cell_Index: "Integer"
      Special_Room_Type: "E_DungeonRoomType"
    outputs:
      bAdded: "Boolean"
      New_Cell_Index: "Integer"
    validations:
      - "DungeonCells.Length > 0"
      - "DungeonCells.IsValidIndex(Parent Cell Index)"
      - "Special Room Type != Start"
      - "Special Room Type != Normal"
    failure:
      bAdded: false
      New_Cell_Index: -1
    direction_search:
      start_index: "Random Integer in Range from Stream 0..3"
      loop: "For Loop 0..3"
      expression: "(Direction Start Index + Loop Index) % 4"
      mapping:
        0: "North"
        1: "East"
        2: "South"
        3: "West"
      occupied_true: "End iteration and continue"
      free_false: "Create and return success"
      completed: "Return false, -1"
    creation:
      - "Set connection on parent"
      - "Make ST_DungeonCell with Special Room Type"
      - "Set opposite connection on child"
      - "Add DungeonCells"
      - "Add DungeonCellLinks"
    New_Cell_Index_source: "Return Value of DungeonCells Add"
    corrected_bug:
      wrong: "Integer division by 4"
      correct: "Modulo % 4"

  - name: "ChooseKeyAndBossCells"
    status: "confirmed_modified"
    search_logic: "Historical candidate scoring retained"
    index_meanings:
      Key_Cell_Index: "Normal parent chosen for additive Key"
      Boss_Cell_Index: "Normal parent chosen for additive Boss"
    legacy_behavior: "Set Array Elem conversions disconnected"
    final_sequence:
      Then_0: "TryAddSpecialCellFromParent(Key Cell Index, Key)"
      Then_1: "TryAddSpecialCellFromParent(Boss Cell Index, Boss)"
    confirmed_messages:
      - "KEY SPECIAL ADDED"
      - "BOSS SPECIAL ADDED"

  - name: "SpawnStartRoom"
    status: "confirmed"
    result: "SpawnedRooms[0] = Start"
    initialization_count: 1

  - name: "SpawnFirstChildRoom"
    status: "historical_prototype_pending_cleanup"
    note: "Retained until PlaceChildRoomFromParent regression and Find References cleanup."

  - name: "PlaceChildRoomFromParent"
    status: "confirmed"
    input:
      Child_Index: "Integer"
    output:
      Room_Placed: "Boolean"
    validations:
      - "DungeonCells.IsValidIndex(Child Index)"
      - "DungeonCellLinks.IsValidIndex(Child Index)"
      - "bHasParent == true"
      - "SpawnedRooms.IsValidIndex(Parent Cell Index)"
      - "Parent Room Actor valid"
      - "Child Room Actor valid"
    class_selection:
      Normal: "Procedural room class"
      Key: "BP_Room_PreBuilt_Base_Child_Key"
      Boss: "BP_Room_PreBuilt_Base_Child_Boss"
      Start: "Error and false"
    spawn:
      collision_handling: "Always Spawn, Ignore Collisions"
      initialization_count: 1
    directions:
      Parent_Direction: "DungeonCellLinks[Child Index].DirectionFromParent"
      Child_Entry_Direction: "GetOppositeDirection(Parent Direction)"
    placement:
      desired_child_door: "ParentDoorLocation + GetDirectionVector(ParentDirection) * CorridorLength"
      move_delta: "DesiredChildDoor - ChildDoorLocation"
      new_location: "ChildRoomActor.GetActorLocation + MoveDelta"
      requery_child_door_each_attempt: true
    retry_defaults:
      Corridor_Length: 1000.0
      Placement_Retry_Step: 500.0
      Max_Placement_Attempts: 10
    retry_loop:
      type: "For Loop with Break"
      first: 0
      last: "Max Placement Attempts - 1"
      overlap_true: "Corridor Length += Placement Retry Step"
      overlap_false: "bPlacementSucceeded = true -> Break"
    success:
      - "Add Child Room Actor to SpawnedRooms"
      - "Room Placed = true"
    failure:
      - "Print diagnostic"
      - "Destroy Child Room Actor"
      - "Room Placed = false"

  - name: "DoesRoomOverlapPlacedRooms"
    status: "confirmed"
    input:
      Candidate_Room_Actor: "Actor Object Reference"
    output:
      Overlaps_Placed_Rooms: "Boolean"
    locals:
      Candidate_Bounds_Center: "Vector"
      Candidate_Bounds_Extent: "Vector"
      Placed_Room_Actor: "Actor Object Reference"
      Placed_Bounds_Center: "Vector"
      Placed_Bounds_Extent: "Vector"
      Found_Overlap: "Boolean"
    loop: "For Each Loop with Break over SpawnedRooms"
    ignores:
      - "Invalid actors"
      - "Candidate itself"
    aabb:
      x: "Abs(CandidateCenterX - PlacedCenterX) <= CandidateExtentX + PlacedExtentX"
      y: "Abs(CandidateCenterY - PlacedCenterY) <= CandidateExtentY + PlacedExtentY"
      z: "Abs(CandidateCenterZ - PlacedCenterZ) <= CandidateExtentZ + PlacedExtentZ"
      final: "X AND Y AND Z"
    overlap_true: "Found Overlap = true -> Break"
    completed: "Return Found Overlap"

  - name: "GetOppositeDirection"
    status: "protected"
    pure: true
    mapping:
      North: "South"
      East: "West"
      South: "North"
      West: "East"

  - name: "GetDirectionVector"
    status: "confirmed"
    pure: true
    mapping:
      North: [0, 1, 0]
      East: [1, 0, 0]
      South: [0, -1, 0]
      West: [-1, 0, 0]

  - name: "GetNeighborCoord"
    status: "protected"
    mapping:
      North: [0, 1]
      East: [1, 0]
      South: [0, -1]
      West: [-1, 0]

  - name: "IsCellOccupied"
    status: "protected"

  - name: "FindCellIndexByCoord"
    status: "protected"

  - name: "SetConnectionOnCell"
    status: "protected"

  - name: "SpawnRoomsFromCells"
    status: "legacy_disconnected_pending_cleanup"

  - name: "SpawnCorridorsFromConnections"
    status: "protected_disconnected"
    processed_directions: ["North", "East"]

  - name: "SpawnBossRoomDoors"
    status: "protected_disconnected"

confirmed_room_result:
  MaxRooms: 10
  Start: 1
  Normal: 10
  Key: 1
  Boss: 1
  total: 13

seed_corrections:
  12345: "South"
  12346: "East"

next_phase:
  name: "Prebuilt door-pattern compatibility"
  patterns:
    - "Dead End"
    - "Straight"
    - "Corner/L"
    - "T"
    - "Cross"
  rotations: [0, 90, 180, 270]
  core_rule: "Never invent doors for a prebuilt room"

protected_mappings:
  init_room_from_cell:
    North: "SouthOpening"
    East: "WestOpening"
    South: "NorthOpening"
    West: "EastOpening"
  get_door_world_location:
    North: "Arrow_Entrance_South"
    East: "Arrow_Exit_East"
    South: "Arrow_Exit_North"
    West: "Arrow_Exit_West"
