place_child_room_from_parent:
  status: "confirmed"
  input:
    Child_Index: "Integer"
  output:
    Room_Placed: "Boolean"
  responsibilities:
    - "Validate child cell and link"
    - "Resolve parent actor from SpawnedRooms"
    - "Select Normal/Key/Boss class"
    - "Spawn actor once"
    - "Init Room from Cell once"
    - "Align parent and child DoorPoints"
    - "Move same actor through retries"
    - "Check global overlap"
    - "Add to SpawnedRooms on success"
    - "Destroy candidate on failure"
  class_mapping:
    Normal: "Procedural common room class"
    Key: "BP_Room_PreBuilt_Base_Child_Key"
    Boss: "BP_Room_PreBuilt_Base_Child_Boss"
    Start: "Invalid as child"
  retry_defaults:
    Corridor_Length: 1000.0
    Placement_Retry_Step: 500.0
    Max_Placement_Attempts: 10
  rules:
    - "Do not SpawnActor again during retries"
    - "Do not Init Room from Cell again"
    - "Do not regenerate HISM"
    - "Requery Child Door Location every attempt"

placement_formula:
  desired_child_door: "ParentDoorLocation + GetDirectionVector(ParentDirection) * CorridorLength"
  move_delta: "DesiredChildDoor - ChildDoorLocation"
  new_location: "ChildRoomActor.GetActorLocation + MoveDelta"

room_overlap:
  function: "DoesRoomOverlapPlacedRooms"
  status: "confirmed"
  input: "Candidate Room Actor"
  output: "Overlaps Placed Rooms"
  behavior:
    - "Get candidate bounds"
    - "Loop SpawnedRooms with break"
    - "Ignore invalid actors"
    - "Ignore candidate itself"
    - "Get placed bounds"
    - "AABB X/Y/Z"
    - "Break on first overlap"
  formulas:
    x: "abs(candidate_center_x - placed_center_x) <= candidate_extent_x + placed_extent_x"
    y: "abs(candidate_center_y - placed_center_y) <= candidate_extent_y + placed_extent_y"
    z: "abs(candidate_center_z - placed_center_z) <= candidate_extent_z + placed_extent_z"
    final: "x AND y AND z"

special_cells:
  function: "TryAddSpecialCellFromParent"
  status: "confirmed"
  inputs:
    Parent_Cell_Index: "Integer"
    Special_Room_Type: "E_DungeonRoomType"
  outputs:
    bAdded: "Boolean"
    New_Cell_Index: "Integer"
  rejects:
    - "Start"
    - "Normal"
  failure_index: -1
  success_index_source: "Return Value of DungeonCells Add"
  direction_search:
    start: "Random integer 0..3 from RandomStream"
    loop: "0..3"
    formula: "(DirectionStartIndex + LoopIndex) % 4"
    mapping:
      0: "North"
      1: "East"
      2: "South"
      3: "West"
    failure: "Only after all four coordinates are occupied"
  corrected_bug:
    wrong: "Integer division by 4"
    correct: "Modulo % 4"

